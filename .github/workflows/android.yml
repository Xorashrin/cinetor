name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Run engine unit and integration tests
        run: npm run test:engine

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify Release APK Deliverable
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK file not found under android/app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Found Release APK: $APK_FILE"
          ls -la "$APK_FILE"
          APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          echo "Release APK Size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 10000000 ]; then
            echo "::error::Release APK size is unexpectedly small ($APK_SIZE bytes)!"
            exit 1
          fi
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "Release APK SHA-256: $SHA256"
          echo "RELEASE_APK_SHA256=$SHA256" >> $GITHUB_ENV

          # Verify that the release APK contains the embedded JavaScript bundle
          if unzip -l "$APK_FILE" | grep -q "assets/index.android.bundle"; then
            echo "VERIFIED: assets/index.android.bundle is embedded in Release APK!"
          else
            echo "::error::FATAL: Release APK does NOT contain embedded JavaScript bundle!"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: cinetor-android-release
          path: android/app/build/outputs/apk/release/*.apk
