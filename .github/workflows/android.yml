name: Android APK

on:
  push:
    branches: [main, feat/cinetor-three-engine-redesign]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
    inputs:
      refresh-lock:
        description: Refresh the npm lockfile in the cloud without building an APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cinetor-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resolve SDK patch versions without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v5
        with:
          name: cinetor-refreshed-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh-lock
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CI: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate original Cinetor assets
        run: python3 -I tools/make_cinetor_icons.py assets
      - name: Verify TypeScript contracts and deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/checks
          npm run typecheck 2>&1 | tee artifacts/checks/typecheck.log
          npm test 2>&1 | tee artifacts/checks/typescript-tests.log
          python3 -I -m unittest discover -s test/tools -p 'test_*.py' 2>&1 | tee artifacts/checks/release-tools-tests.log
          npx expo install --check 2>&1 | tee artifacts/checks/expo-compatibility.log
          npx expo-doctor 2>&1 | tee artifacts/checks/expo-doctor.log
      - name: Generate secure Android project
        run: npm run prebuild:android
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the reviewed native host for the owned fixture
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android :cinetor-engines:assembleRelease -Pcinetor.fixtureBootstrap=true --no-daemon 2>&1 | tee artifacts/checks/native-host.log
          python3 -I tools/fetch_engine_sources.py --prepare-fixture --host-aar modules/cinetor-engines/android/build/outputs/aar/cinetor-engines-release.aar
          ./android/gradlew -p modules/cinetor-engines/fixtures/cloudstream assembleRelease --no-daemon 2>&1 | tee artifacts/checks/cloudstream-fixture.log
          python3 -I tools/fetch_engine_sources.py --package-fixture --fixture-apk modules/cinetor-engines/fixtures/cloudstream/build/outputs/apk/release/cloudstream-release-unsigned.apk
      - name: Run native BDIX and media policy tests
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android :cinetor-bdix:testDebugUnitTest :cinetor-media:testReleaseUnitTest --no-daemon 2>&1 | tee artifacts/checks/native-unit-tests.log
          python3 -I tools/verify_native_tests.py --root modules/cinetor-bdix/android/build/test-results/testDebugUnitTest --require-class BdixPolicyTest --require-class BdixHttpFixtureTest --require-class BdixFtpFixtureTest --require-class BdixFtpsFixtureTest --output artifacts/checks/bdix-tests.json
          python3 -I tools/verify_native_tests.py --root modules/cinetor-media/android/build/test-results/testReleaseUnitTest --require-class MediaSafetyTest --output artifacts/checks/media-tests.json
      - name: Build universal Android release variant
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --no-daemon 2>&1 | tee artifacts/checks/android-release.log
      - name: Sign and inspect release deliverable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/release
          cp android/app/build/outputs/apk/release/app-release.apk builds/release/cinetor-v2.0.0-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          # Expo defaults to its development certificate. This is a release variant,
          # but is explicitly NOT a privately signed distribution release.
          "$APKSIGNER" sign --ks android/app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true builds/release/cinetor-v2.0.0-release.apk
          python3 -I tools/verify_apk.py builds/release/cinetor-v2.0.0-release.apk --commit "$GITHUB_SHA" --output builds/release/release-evidence.json
      - name: Prepare corresponding source and exact application source
        run: |
          python3 -I tools/fetch_engine_sources.py --source-bundle --output artifacts/engine-corresponding-source
          git archive --format=tar --prefix=cinetor/ "$GITHUB_SHA" | gzip -n > artifacts/engine-corresponding-source/cinetor-app-source.tar.gz
          cp modules/cinetor-engines/android/generated-assets/cinetor/owned-fixture.json artifacts/engine-corresponding-source/owned-fixture.json
          tar -czf builds/release/cinetor-v2.0.0-corresponding-source.tar.gz -C artifacts engine-corresponding-source
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify native engines and signed startup on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072
          script: |
            ./android/gradlew -p android :cinetor-engines:connectedReleaseAndroidTest --no-daemon
            python3 -I tools/verify_native_tests.py --root modules/cinetor-engines/android/build/outputs/androidTest-results/connected --require-class NativeEnginesInstrumentedTest --output artifacts/checks/native-engine-tests.json
            python3 -I tools/android_smoke.py builds/release/cinetor-v2.0.0-release.apk --output builds/release/startup-evidence.json
      - name: Bind verification records and checksums to the deliverable
        run: |
          cp artifacts/checks/bdix-tests.json artifacts/checks/media-tests.json artifacts/checks/native-engine-tests.json builds/release/
          cp config/engine-lock.json config/android-signing.json builds/release/
          cp LICENSE LICENSES.md builds/release/
          cp -R licenses builds/release/licenses
          python3 -I -c 'import hashlib,pathlib; root=pathlib.Path("builds/release"); paths=sorted(p for p in root.rglob("*") if p.is_file() and p.name!="SHA256SUMS"); (root/"SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+str(p.relative_to(root))+"\n" for p in paths))'
      - name: Upload passing release candidate with corresponding source
        uses: actions/upload-artifact@v5
        with:
          name: cinetor-v2.0.0-${{ github.sha }}
          path: builds/release/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve verification logs and native reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cinetor-checks-${{ github.sha }}
          path: |
            artifacts/checks/
            modules/*/android/build/reports/
            modules/*/android/build/test-results/
            modules/cinetor-engines/android/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
