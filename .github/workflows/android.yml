name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinetor-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify engine and SDK compatibility
        run: |
          npm run typecheck
          npm test
          npx expo install --check
          npx expo-doctor
      - name: Generate Android project
        run: npm run prebuild:android
      - name: Build universal Android release variant
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --no-daemon
      - name: Sign and inspect release deliverable
        run: |
          mkdir -p builds/release
          cp android/app/build/outputs/apk/release/app-release.apk builds/release/cinetor-v1.0.3-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          # Expo defaults to its development certificate. This is a release variant,
          # but is explicitly NOT a privately signed distribution release.
          "$APKSIGNER" sign --ks android/app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true builds/release/cinetor-v1.0.3-release.apk
          python3 tools/verify_apk.py builds/release/cinetor-v1.0.3-release.apk --commit "$GITHUB_SHA" --output builds/release/release-evidence.json
          cd builds/release
          sha256sum cinetor-v1.0.3-release.apk > SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: cinetor-android-release
          path: builds/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish commit-bound APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          target_commitish: ${{ github.sha }}
          name: Cinetor v1.0.3 Android release variant
          body: |
            Modular catalog discovery engine with scoped HTTP(S) JSON, HTML directory,
            M3U and direct-media adapters. Source configuration starts empty; supply
            authorized endpoints before live discovery. No real-source scans are claimed.
            Android scheduled refresh uses Expo BackgroundTask / WorkManager.

            Built from commit ${{ github.sha }}. Package com.cinator.app, version 1.0.3 (4).
            Universal arm64-v8a / armeabi-v7a / x86_64 release variant with embedded Hermes bundle.
            Signed with Android's debug certificate: private distribution signing is NOT configured.
            Device startup/playback/background execution are NOT VERIFIED by this workflow.
            See release-evidence.json and SHA256SUMS for inspected artifact metadata.
          files: |
            builds/release/cinetor-v1.0.3-release.apk
            builds/release/release-evidence.json
            builds/release/SHA256SUMS
