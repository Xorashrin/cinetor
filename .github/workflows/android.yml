name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinetor-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify providers, offline downloads, and SDK compatibility
        run: |
          npm run typecheck
          npm test
          npx expo install --check
          npx expo-doctor
      - name: Generate Android project
        run: npm run prebuild:android
      - uses: gradle/actions/setup-gradle@v4
      - name: Build universal Android release variant
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --no-daemon
      - name: Sign and inspect release deliverable
        run: |
          mkdir -p builds/release
          cp android/app/build/outputs/apk/release/app-release.apk builds/release/cinetor-v1.1.1-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          # Expo defaults to its development certificate. This is a release variant,
          # but is explicitly NOT a privately signed distribution release.
          "$APKSIGNER" sign --ks android/app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true builds/release/cinetor-v1.1.1-release.apk
          python3 tools/verify_apk.py builds/release/cinetor-v1.1.1-release.apk --commit "$GITHUB_SHA" --output builds/release/release-evidence.json
          cd builds/release
          sha256sum cinetor-v1.1.1-release.apk > SHA256SUMS
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify release startup on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048
          script: python3 tools/android_smoke.py builds/release/cinetor-v1.1.1-release.apk --output builds/release/startup-evidence.json
      - uses: actions/upload-artifact@v5
        with:
          name: cinetor-android-release
          path: builds/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish commit-bound APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          target_commitish: ${{ github.sha }}
          name: Cinetor v1.1.1 Android release variant
          prerelease: false
          make_latest: true
          body: |
            CineHD metadata and provider integration with native ad-free navigation.
            Metadata/search/details/episodes use the observed public metadata proxy.
            Native AWSIND resolver and IPTV directory replace the previous sources.
            Native source selection and MP4/finite HLS offline downloads are included.

            Built from commit ${{ github.sha }}. Package com.cinator.app, version 1.1.1 (6).
            Universal arm64-v8a / armeabi-v7a / x86_64 release variant with embedded Hermes bundle.
            Signed with Android's debug certificate; private distribution signing is not configured.
            Android 15 startup is checked on this signed APK before publication.
            Actual provider/device playback availability is documented in docs/CINEHD_IMPLEMENTATION_REPORT.md.
            See release-evidence.json, startup-evidence.json, and SHA256SUMS for artifact verification.
          files: |
            builds/release/cinetor-v1.1.1-release.apk
            builds/release/release-evidence.json
            builds/release/SHA256SUMS
            builds/release/startup-evidence.json
