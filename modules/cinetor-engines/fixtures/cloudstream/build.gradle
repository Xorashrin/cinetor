plugins {
    id 'com.android.application' version '9.2.1'
    id 'org.jetbrains.kotlin.android' version '2.4.10'
}

android {
    namespace 'com.cinetor.fixture'
    compileSdk 36
    defaultConfig {
        applicationId 'com.cinetor.fixture'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1'
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Compile against the actual bootstrap host ABI but do not package it or the
    // runtime dependencies into the extension. This guarantees real DEX loading.
    compileOnly files('sdk/host-classes.jar', 'sdk/cloudstream-classes.jar')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.11.0'
}

tasks.named('preBuild').configure {
    doFirst {
        if (!file('sdk/host-classes.jar').isFile() || !file('sdk/cloudstream-classes.jar').isFile()) {
            throw new GradleException('Run tools/fetch_engine_sources.py --prepare-fixture after building the bootstrap host AAR')
        }
    }
}
